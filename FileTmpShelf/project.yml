name: FileTmpShelf
options:
  bundleIdPrefix: com.filetmpshelf
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD_64_BIT)"
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
targets:
  FileTmpShelf:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filetmpshelf.app
        PRODUCT_NAME: FileTmpShelf
        INFOPLIST_KEY_CFBundleDisplayName: FileTmpShelf
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ENABLE_APP_SANDBOX: NO
  FileTmpShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: FileTmpShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filetmpshelf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FileTmpShelf:
    build:
      targets:
        FileTmpShelf: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FileTmpShelfTests
